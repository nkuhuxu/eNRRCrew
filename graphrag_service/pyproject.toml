[project]
name = "enrrcrew-rag"
version = "0.5.1"
description = "Local versioned GraphRAG 3.1.2 service for eNRRCrew"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.136.3",
    "graphrag==3.1.2",
    "httpx>=0.28,<1",
    "numpy==2.4.3",
    "openpyxl==3.1.5",
    "pandas==3.0.1",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "python-multipart>=0.0.20,<1",
    "pyyaml==6.0.3",
    "uvicorn[standard]>=0.41,<1",
    "xlrd==2.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enrrcrew_rag"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.coverage.run]
omit = ["src/enrrcrew_rag/baseline.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
